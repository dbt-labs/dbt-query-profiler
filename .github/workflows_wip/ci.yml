# CI workflow - runs the dbt-labs/dbt-package-testing reusable workflow against
# every supported adapter, invoked via mise's `test:<adapter>` tasks (mise.toml).
#
# Kept in workflows_wip/ (not .github/workflows/) so it does not actually run
# yet - see mise.toml and CONTRIBUTING.md to run these tasks locally instead.

name: CI

on:
  push:
    branches: [main]
  pull_request_target:

permissions:
  contents: read

# Cancel superseded runs: a new push to a branch stops the previous run's matrix
# instead of letting it finish alongside the new one. run_tox.yml doesn't manage
# this itself, so it's the caller's responsibility.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    uses: dbt-labs/dbt-package-testing/.github/workflows/run_tox.yml@v2
    with:
      adapters: "duckdb,snowflake,bigquery,databricks,redshift"
      test_runner: "mise"
      # Fork PRs need `pull_request_target` to get secrets; gate that behind an
      # approved environment so a maintainer signs off before secrets are used.
      environment: >-
        ${{ github.event_name == 'pull_request_target'
            && github.event.pull_request.head.repo.full_name != github.repository
            && 'cloud-tests' || '' }}
      ref: ${{ github.event.pull_request.head.sha || '' }}
      # snowflake
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_SCHEMA: "dbt_query_profiler_${{ github.run_number }}"
      # bigquery
      BIGQUERY_PROJECT: ${{ vars.BIGQUERY_PROJECT }}
      BIGQUERY_SCHEMA: "dbt_query_profiler_${{ github.run_number }}"
      # databricks
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
      DATABRICKS_SCHEMA: "dbt_query_profiler_${{ github.run_number }}"
      # redshift
      REDSHIFT_HOST: ${{ vars.REDSHIFT_HOST }}
      REDSHIFT_USER: ${{ vars.REDSHIFT_USER }}
      REDSHIFT_DATABASE: ${{ vars.REDSHIFT_DATABASE }}
      REDSHIFT_PORT: ${{ vars.REDSHIFT_PORT }}
      REDSHIFT_SCHEMA: "dbt_query_profiler_${{ github.run_number }}"
    secrets:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_ENV_SECRET_SNOWFLAKE_PASS: ${{ secrets.DBT_ENV_SECRET_SNOWFLAKE_PASS }}
      BIGQUERY_KEYFILE_JSON: ${{ secrets.BIGQUERY_KEYFILE_JSON }}
      DBT_ENV_SECRET_DATABRICKS_TOKEN: ${{ secrets.DBT_ENV_SECRET_DATABRICKS_TOKEN }}
      DBT_ENV_SECRET_REDSHIFT_PASS: ${{ secrets.DBT_ENV_SECRET_REDSHIFT_PASS }}
