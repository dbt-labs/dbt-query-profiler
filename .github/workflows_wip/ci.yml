# CI workflow - runs on every PR and push to main
# Tier 1: Compilation tests for all adapters (no credentials needed)
# Tier 2: DuckDB integration tests (free, local)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Python version comes from .python-version, which uv reads automatically.
  # Absolute path: tox runs with changedir=integration_tests, so a relative
  # profiles dir would resolve against the wrong directory.
  DBT_PROFILES_DIR: ${{ github.workspace }}/integration_tests/profiles

permissions:
  contents: read

jobs:
  # Tier 1: Verify macros compile for all adapters
  compile:
    name: Compile (${{ matrix.adapter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        adapter: [snowflake, bigquery, databricks, redshift, duckdb]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the adapter dependency group
        run: uv sync --group ${{ matrix.adapter }}

      - name: Run compilation test
        run: uv run tox -e compile_${{ matrix.adapter }}
        # `dbt parse` renders profiles.yml, whose env_var() calls have no defaults, so
        # it fails on a missing variable before it ever reaches the macros. Parsing
        # never opens a connection, so placeholders are enough - and keeping them
        # obviously fake avoids any suggestion that this tier talks to a warehouse.
        # Real credentials live in integration.yml, which is not triggered by pull_request.
        env:
          SNOWFLAKE_ACCOUNT: not-a-real-account
          SNOWFLAKE_USER: ci
          DBT_ENV_SECRET_SNOWFLAKE_PASS: ci
          SNOWFLAKE_ROLE: ci
          SNOWFLAKE_DATABASE: ci
          SNOWFLAKE_WAREHOUSE: ci
          BIGQUERY_PROJECT: not-a-real-project
          BIGQUERY_KEYFILE_JSON: "{}"
          BIGQUERY_LOCATION: US
          DATABRICKS_HOST: not-a-real-host
          DATABRICKS_HTTP_PATH: /sql/1.0/warehouses/ci
          DBT_ENV_SECRET_DATABRICKS_TOKEN: ci
          DATABRICKS_CATALOG: ci
          REDSHIFT_HOST: not-a-real-host
          REDSHIFT_USER: ci
          DBT_ENV_SECRET_REDSHIFT_PASS: ci
          REDSHIFT_DATABASE: ci
          REDSHIFT_PORT: "5439"

  # Tier 2: Full integration tests with DuckDB
  integration-duckdb:
    name: Integration (DuckDB)
    runs-on: ubuntu-latest
    needs: [compile]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dev dependencies (includes dbt-duckdb)
        run: uv sync

      - name: Run DuckDB integration tests
        run: uv run tox -e dbt_integration_duckdb
        env:
          DUCKDB_PATH: ":memory:"
