version: 2

macros:
  - name: get_query_history
    description: |
      Returns SQL to query the data warehouse's query history with flexible filters.

      **Supported adapters:** Snowflake, BigQuery, Databricks, Redshift, DuckDB

      By default, uses user-scoped views (no special permissions). Set `use_account_level_history: true` for broader access.

      **DuckDB note:** Requires logging enabled with `CALL enable_logging('QueryLog');`
    arguments:
      - name: table_name
        type: string
        description: Filter by table name in query text (case-insensitive partial match)
      - name: user_name
        type: string
        description: Filter by user. Defaults to target.user. Set to empty string to disable filter.
      - name: query_type
        type: string
        description: Filter by query type (e.g., 'SELECT', 'INSERT', 'CREATE_TABLE_AS_SELECT')
      - name: limit
        type: integer
        description: Number of queries to return. Default 1.
      - name: result_limit
        type: integer
        description: Number of queries to look back through. Default 100, max 10000 (Snowflake).
      - name: node_id
        type: string
        description: "Filter by dbt node id (e.g. 'model.my_project.my_model'), matched exactly against the node_id embedded in dbt's default query comment. Mutually exclusive with model_name."
      - name: model_name
        type: string
        description: "Filter by dbt model name instead of node_id. Resolved to a node id via the dbt graph, then matched against dbt's query comment. Mutually exclusive with node_id."

  - name: print_query_history
    description: |
      Executes get_query_history and prints results as a JSON array.
      Self-excludes its own queries from results (via query tags or comments).

      **Usage:** `dbt run-operation print_query_history --args '{limit: 5, query_type: SELECT}'`
    arguments:
      - name: table_name
        type: string
        description: Filter by table name in query text (case-insensitive partial match)
      - name: user_name
        type: string
        description: Filter by user. Defaults to target.user. Set to empty string to disable filter.
      - name: query_type
        type: string
        description: Filter by query type (e.g., 'SELECT', 'INSERT', 'CREATE_TABLE_AS_SELECT')
      - name: limit
        type: integer
        description: Number of queries to return. Default 1.
      - name: result_limit
        type: integer
        description: Number of queries to look back through. Default 100, max 10000 (Snowflake).
      - name: node_id
        type: string
        description: "Filter by dbt node id (e.g. 'model.my_project.my_model'), matched exactly against the node_id embedded in dbt's default query comment. Mutually exclusive with model_name."
      - name: model_name
        type: string
        description: "Filter by dbt model name instead of node_id. Resolved to a node id via the dbt graph, then matched against dbt's query comment. Mutually exclusive with node_id."

  - name: get_query_sql
    description: |
      Returns SQL to retrieve the query text for a given query ID.

      **Supported adapters:** Snowflake, BigQuery, Databricks, Redshift, DuckDB
    arguments:
      - name: query_id
        type: string
        description: The query ID (Snowflake query_id, BigQuery job_id, Databricks statement_id, Redshift query_id, or DuckDB '<context_id>:<epoch_us>' as returned by get_query_history)
      - name: result_limit
        type: integer
        description: "Number of queries to look back through. Accepted by all adapters, but only affects Snowflake — the others look the query up by ID directly. Also used as the lookback window when resolving model_name/node_id to a query_id. Default: 1000, max: 10000."
      - name: model_name
        type: string
        description: "Profile a dbt model by name instead of a query ID. Resolved to a node id via the dbt graph, then matched against dbt's query comment. Mutually exclusive with query_id and node_id."
      - name: node_id
        type: string
        description: "Profile by dbt node id (e.g. model.my_project.my_model), skipping graph lookup. Useful when you already have one, e.g. from run_results.json. Mutually exclusive with query_id and model_name."
      - name: num_candidates
        type: integer
        description: "How many of the model's most recent statements to consider before picking the slowest. Default 10. A run can emit several statements (an incremental does a temp build then a merge); dbt's query comment has no invocation_id, so the run boundary is not recoverable and this is an approximation."

  - name: print_query_sql
    description: |
      Executes get_query_sql and prints the SQL text for a given query ID.

      **Usage:** `dbt run-operation print_query_sql --args '{query_id: "01b3a4f2-..."}'`
    arguments:
      - name: query_id
        type: string
        description: The query ID (Snowflake query_id, BigQuery job_id, Databricks statement_id, Redshift query_id, or DuckDB '<context_id>:<epoch_us>' as returned by get_query_history)
      - name: result_limit
        type: integer
        description: "Number of queries to look back through. Accepted by all adapters, but only affects Snowflake — the others look the query up by ID directly. Also used as the lookback window when resolving model_name/node_id to a query_id. Default: 1000, max: 10000."
      - name: model_name
        type: string
        description: "Profile a dbt model by name instead of a query ID. Resolved to a node id via the dbt graph, then matched against dbt's query comment. Mutually exclusive with query_id and node_id."
      - name: node_id
        type: string
        description: "Profile by dbt node id (e.g. model.my_project.my_model), skipping graph lookup. Useful when you already have one, e.g. from run_results.json. Mutually exclusive with query_id and model_name."
      - name: num_candidates
        type: integer
        description: "How many of the model's most recent statements to consider before picking the slowest. Default 10. A run can emit several statements (an incremental does a temp build then a merge); dbt's query comment has no invocation_id, so the run boundary is not recoverable and this is an approximation."

  - name: get_query_plan
    description: |
      Returns SQL for an EXPLAIN-based query plan (estimated costs, not actual execution stats).

      **Supported adapters:** Snowflake, Databricks, Redshift, DuckDB

      BigQuery does not support EXPLAIN via SQL.

      For dbt models, first compile with `dbt compile --select model_name` then pass the compiled SQL.

      **Not usable inside a model.** The returned `EXPLAIN` statement is not
      composable in SQL — it cannot be wrapped in a subquery, a CTE, or a view body.
      Pass it to `run_query()` from a macro or run-operation instead.
    arguments:
      - name: sql
        type: string
        description: The SQL to explain (must be compiled SQL, not Jinja)

  - name: print_query_plan
    description: |
      Runs EXPLAIN on the provided SQL and prints the estimated query plan.

      **Supported adapters:** Snowflake, Databricks, Redshift, DuckDB

      **Usage:** `dbt run-operation print_query_plan --args '{sql: "SELECT * FROM my_table"}'`

      For dbt models, first compile with `dbt compile --select model_name` then pass the compiled SQL.
    arguments:
      - name: sql
        type: string
        description: The SQL to explain (must be compiled SQL, not Jinja)
      - name: format
        type: string
        description: |
          Output format:
          - 'text' (default): Compact terminal-friendly output
          - 'json': Full details as JSON
          - 'graphviz': DOT format for Graphviz (DuckDB only)
          - 'html': HTML output (DuckDB only)

  - name: get_execution_plan
    description: |
      Returns SQL to retrieve the actual execution plan with operator statistics from a previously executed query.

      **Supported adapters:** Snowflake, Databricks, Redshift, DuckDB

      BigQuery does not expose operator-level execution statistics via SQL.

      **Not usable inside a model.** On Databricks and DuckDB this returns an
      `EXPLAIN` statement, and `EXPLAIN` is not composable in SQL — it cannot be
      wrapped in a subquery, a CTE, or a view body. Pass the result to `run_query()`
      from a macro or run-operation instead. (Snowflake and Redshift return a plain
      SELECT over a system view, so those two are composable.)

      **Redshift** reaches `stl_explain` by correlating `sys_query_history.transaction_id`
      with `stl_query.xid` plus time bounds, because the two use different query ID
      spaces. A transaction can hold more than one explained statement, so the result
      includes a `statement_id` column and is ordered by it — check it before reading
      the plan as a single tree. STL tables are pruned aggressively, so plans are
      usually unavailable for older queries.
    arguments:
      - name: query_id
        type: string
        description: The query ID of a previously executed query
      - name: model_name
        type: string
        description: "Profile a dbt model by name instead of a query ID. Resolved to a node id via the dbt graph, then matched against dbt's query comment. Mutually exclusive with query_id and node_id."
      - name: node_id
        type: string
        description: "Profile by dbt node id (e.g. model.my_project.my_model), skipping graph lookup. Useful when you already have one, e.g. from run_results.json. Mutually exclusive with query_id and model_name."
      - name: num_candidates
        type: integer
        description: "How many of the model's most recent statements to consider before picking the slowest. Default 10. A run can emit several statements (an incremental does a temp build then a merge); dbt's query comment has no invocation_id, so the run boundary is not recoverable and this is an approximation."
      - name: result_limit
        type: integer
        description: "How far back through history to look when resolving model_name/node_id to a query_id. Accepted by all adapters, but only affects Snowflake - mirrors get_query_history's result_limit. Default 1000, max 10000 (Snowflake)."

  - name: print_execution_plan
    description: |
      Retrieves and prints the actual execution plan with operator statistics from a previously executed query.

      **Supported adapters:** Snowflake, Databricks, Redshift, DuckDB

      **Usage:** `dbt run-operation print_execution_plan --args '{query_id: "...", format: "text"}'`
    arguments:
      - name: query_id
        type: string
        description: The query ID of a previously executed query
      - name: format
        type: string
        description: |
          Output format:
          - 'json' (default): Full details as JSON
          - 'text': Compact terminal-friendly output
          - 'markdown': Table format (Snowflake only)
      - name: model_name
        type: string
        description: "Profile a dbt model by name instead of a query ID. Resolved to a node id via the dbt graph, then matched against dbt's query comment. Mutually exclusive with query_id and node_id."
      - name: node_id
        type: string
        description: "Profile by dbt node id (e.g. model.my_project.my_model), skipping graph lookup. Useful when you already have one, e.g. from run_results.json. Mutually exclusive with query_id and model_name."
      - name: num_candidates
        type: integer
        description: "How many of the model's most recent statements to consider before picking the slowest. Default 10. A run can emit several statements (an incremental does a temp build then a merge); dbt's query comment has no invocation_id, so the run boundary is not recoverable and this is an approximation."
      - name: result_limit
        type: integer
        description: "How far back through history to look when resolving model_name/node_id to a query_id. Accepted by all adapters, but only affects Snowflake - mirrors get_query_history's result_limit. Default 1000, max 10000 (Snowflake)."
      - name: min_pct
        type: float
        description: "Snowflake only. Only include operators whose time% is at or above this threshold (e.g. 5 for 5%). Accepted by all adapters but only Snowflake applies it - useful for cutting a wide, union-heavy plan (100+ operators, most at 0% time) down to the ones worth reading."
      - name: top_n
        type: integer
        description: "Snowflake only. Only include the top N operators by time%. Accepted by all adapters but only Snowflake applies it. Combine with min_pct to both threshold and cap. When either is set, output is sorted by time% descending instead of the plan's natural operator_id order."

  - name: get_execution_plan_summary
    description: |
      Returns SQL for a summarized view of the execution plan with key metrics extracted.

      **Supported adapters:** Snowflake, Databricks, Redshift, DuckDB
    arguments:
      - name: query_id
        type: string
        description: The query ID of a previously executed query
      - name: model_name
        type: string
        description: "Profile a dbt model by name instead of a query ID. Resolved to a node id via the dbt graph, then matched against dbt's query comment. Mutually exclusive with query_id and node_id."
      - name: node_id
        type: string
        description: "Profile by dbt node id (e.g. model.my_project.my_model), skipping graph lookup. Useful when you already have one, e.g. from run_results.json. Mutually exclusive with query_id and model_name."
      - name: num_candidates
        type: integer
        description: "How many of the model's most recent statements to consider before picking the slowest. Default 10. A run can emit several statements (an incremental does a temp build then a merge); dbt's query comment has no invocation_id, so the run boundary is not recoverable and this is an approximation."
      - name: result_limit
        type: integer
        description: "How far back through history to look when resolving model_name/node_id to a query_id. Accepted by all adapters, but only affects Snowflake - mirrors get_query_history's result_limit. Default 1000, max 10000 (Snowflake)."

  - name: print_execution_plan_summary
    description: |
      Retrieves and prints the summarized execution plan.

      **Supported adapters:** Snowflake, Databricks, Redshift, DuckDB

      On Snowflake, this is the one place spilling info (bytes spilled to local/remote
      disk - the evidence for a warehouse-sizing decision) is surfaced outside the raw
      per-operator JSON blob in `print_execution_plan`'s `json` format. On the other
      adapters, `get_execution_plan_summary` has no metrics distinct from
      `get_execution_plan`, so this just prints the same plan as `print_execution_plan`
      (Databricks uses `EXPLAIN COST` instead of `EXPLAIN EXTENDED`/`FORMATTED`).

      **Usage:** `dbt run-operation print_execution_plan_summary --args '{query_id: "...", format: "text"}'`
    arguments:
      - name: query_id
        type: string
        description: The query ID of a previously executed query
      - name: format
        type: string
        description: |
          Output format:
          - 'json' (default): Full details as JSON
          - 'text': Compact terminal-friendly output
          - 'markdown': Table format (Snowflake only)
      - name: model_name
        type: string
        description: "Profile a dbt model by name instead of a query ID. Resolved to a node id via the dbt graph, then matched against dbt's query comment. Mutually exclusive with query_id and node_id."
      - name: node_id
        type: string
        description: "Profile by dbt node id (e.g. model.my_project.my_model), skipping graph lookup. Useful when you already have one, e.g. from run_results.json. Mutually exclusive with query_id and model_name."
      - name: num_candidates
        type: integer
        description: "How many of the model's most recent statements to consider before picking the slowest. Default 10. A run can emit several statements (an incremental does a temp build then a merge); dbt's query comment has no invocation_id, so the run boundary is not recoverable and this is an approximation."
      - name: result_limit
        type: integer
        description: "How far back through history to look when resolving model_name/node_id to a query_id. Accepted by all adapters, but only affects Snowflake - mirrors get_query_history's result_limit. Default 1000, max 10000 (Snowflake)."

  - name: get_query_stats
    description: |
      Returns SQL to retrieve execution statistics for a given query ID.
      Provides high-level resource usage metrics (bytes, time, cache, etc.).

      **Supported adapters:** Snowflake, BigQuery, Databricks, Redshift, DuckDB

      **Snowflake metrics:** bytes_scanned, bytes_written_to_result, rows_produced, compilation_time, queue_time, credits

      **BigQuery metrics:** bytes_processed, bytes_billed, cache_hit, slot_ms, bi_engine_mode, dml_statistics, resource_warnings

      **Databricks metrics:** bytes_scanned, bytes_written, rows_produced, read_rows, compilation_duration, execution_duration, queue_time, cache_hit, spilled_local_bytes, shuffle_read_bytes

      **Redshift metrics:** returned_bytes, returned_rows, compile_time, execution_time, queue_time, planning_time, result_cache_hit

      **DuckDB metrics:** Uses EXPLAIN ANALYZE (re-executes query) - timing, rows, operator-level stats

      **DuckDB is not usable inside a model** for this macro: it returns an
      `EXPLAIN ANALYZE` statement, which is not composable in SQL (no subquery, CTE
      or view body). Pass it to `run_query()` instead. The other four adapters return
      a plain SELECT over a system view and are composable.
    arguments:
      - name: query_id
        type: string
        description: The query ID (Snowflake query_id, BigQuery job_id, Databricks statement_id, or Redshift query_id)
      - name: result_limit
        type: integer
        description: "Number of queries to look back through. Default 10000, max 10000 (Snowflake). Also used as the lookback window when resolving model_name/node_id to a query_id."
      - name: model_name
        type: string
        description: "Profile a dbt model by name instead of a query ID. Resolved to a node id via the dbt graph, then matched against dbt's query comment. Mutually exclusive with query_id and node_id."
      - name: node_id
        type: string
        description: "Profile by dbt node id (e.g. model.my_project.my_model), skipping graph lookup. Useful when you already have one, e.g. from run_results.json. Mutually exclusive with query_id and model_name."
      - name: num_candidates
        type: integer
        description: "How many of the model's most recent statements to consider before picking the slowest. Default 10. A run can emit several statements (an incremental does a temp build then a merge); dbt's query comment has no invocation_id, so the run boundary is not recoverable and this is an approximation."

  - name: print_query_stats
    description: |
      Executes get_query_stats and prints execution statistics for a given query ID.

      **Supported adapters:** Snowflake, BigQuery, Databricks, Redshift, DuckDB

      **Usage:** `dbt run-operation print_query_stats --args '{query_id: "...", format: "text"}'`
    arguments:
      - name: query_id
        type: string
        description: The query ID (Snowflake query_id, BigQuery job_id, Databricks statement_id, or Redshift query_id)
      - name: format
        type: string
        description: |
          Output format:
          - 'json' (default): Full details as JSON object
          - 'text': Compact terminal-friendly output
      - name: result_limit
        type: integer
        description: "Number of queries to look back through. Default 10000, max 10000 (Snowflake). Also used as the lookback window when resolving model_name/node_id to a query_id."
      - name: model_name
        type: string
        description: "Profile a dbt model by name instead of a query ID. Resolved to a node id via the dbt graph, then matched against dbt's query comment. Mutually exclusive with query_id and node_id."
      - name: node_id
        type: string
        description: "Profile by dbt node id (e.g. model.my_project.my_model), skipping graph lookup. Useful when you already have one, e.g. from run_results.json. Mutually exclusive with query_id and model_name."
      - name: num_candidates
        type: integer
        description: "How many of the model's most recent statements to consider before picking the slowest. Default 10. A run can emit several statements (an incremental does a temp build then a merge); dbt's query comment has no invocation_id, so the run boundary is not recoverable and this is an approximation."
