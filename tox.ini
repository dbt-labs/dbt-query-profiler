    dbt parse --target redshift

[testenv:compile_duckdb]
changedir = integration_tests
allowlist_externals = dbt
skip_install = true
commands =
    dbt deps
    dbt parse --target duckdb


# Integration tests - full execution against real databases

[testenv:dbt_integration_duckdb]
changedir = integration_tests
allowlist_externals =
    dbt
    bash
skip_install = true
commands =
    dbt --version
    dbt deps --target duckdb
    dbt debug --target duckdb
    ; Run setup models to create query history
    dbt build --target duckdb --select tag:setup --full-refresh
    ; Run tests
    dbt test --target duckdb
    ; Run operation tests
    bash scripts/test_run_operations.sh duckdb

