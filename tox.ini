[tox]
skipsdist = True
envlist = lint, compile_{snowflake,bigquery,databricks,redshift,duckdb}

[testenv]
passenv =
    # DuckDB
    DUCKDB_PATH
    # Snowflake
    SNOWFLAKE_ACCOUNT
    SNOWFLAKE_USER
    DBT_ENV_SECRET_SNOWFLAKE_PASS
    SNOWFLAKE_ROLE
    SNOWFLAKE_DATABASE
    SNOWFLAKE_WAREHOUSE
    SNOWFLAKE_SCHEMA
    # BigQuery
    BIGQUERY_PROJECT
    BIGQUERY_KEYFILE_JSON
    BIGQUERY_SCHEMA
    BIGQUERY_LOCATION
    # Databricks
    DATABRICKS_HOST
    DATABRICKS_HTTP_PATH
    DBT_ENV_SECRET_DATABRICKS_TOKEN
    DATABRICKS_CATALOG
    DATABRICKS_SCHEMA
    # Redshift
    REDSHIFT_HOST
    REDSHIFT_USER
    DBT_ENV_SECRET_REDSHIFT_PASS
    REDSHIFT_DATABASE
    REDSHIFT_PORT
    REDSHIFT_SCHEMA


# Compilation tests - verify macros parse without connecting
# These use mock profiles and only check Jinja syntax

[testenv:compile_snowflake]
changedir = integration_tests
allowlist_externals = dbt
skip_install = true
commands =
    dbt deps
    dbt parse --target snowflake

[testenv:compile_bigquery]
changedir = integration_tests
allowlist_externals = dbt
skip_install = true
commands =
    dbt deps
    dbt parse --target bigquery

[testenv:compile_databricks]
changedir = integration_tests
allowlist_externals = dbt
skip_install = true
commands =
    dbt deps
    dbt parse --target databricks

[testenv:compile_redshift]
changedir = integration_tests
allowlist_externals = dbt
skip_install = true
commands =
